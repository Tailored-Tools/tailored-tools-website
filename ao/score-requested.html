<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Requested | Tailored Tools</title>
    <link rel="icon" href="/favicon.png?v=3" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=6">
    <style>
        :root { --accent: #ff6f20; --dark: #0D1B2A; --white: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .wrap { max-width: 480px; }
        .check {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(63,168,106,0.15);
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
        }
        .check svg { width: 32px; height: 32px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
        p { font-size: 16px; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 24px; }
        a {
            display: inline-block; background: var(--accent); color: var(--white);
            padding: 12px 24px; border-radius: 6px; text-decoration: none;
            font-weight: 700; font-size: 14px; transition: opacity 0.2s;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#3fa86a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h1>Score request received</h1>
        <p>We'll audit your site and send your AO score within 2 working days. Just the number, your band, and your biggest gap. No spam.</p>
        <a href="/ao/">&larr; Back to AO</a>
    </div>
</body>
</html>
